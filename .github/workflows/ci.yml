name: CI

# Every push to a working branch and every pull request: the house rules of
# this project as a script, and a firmware build. The release itself stays
# in build-all-boards.yml and runs on a tag push only.
on:
  push:
    branches: [dev, main, 'feature/**', 'fix/**', 'feat/**']
    paths-ignore: ['manifest.json', 'index.html', 'version.json', 'webflasher/**', 'images/**', '*.md']
  pull_request:
    paths-ignore: ['manifest.json', 'index.html', 'version.json', 'webflasher/**', 'images/**', '*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: House rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node (node --check for the page scripts)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scripts/check.sh
        run: scripts/check.sh

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [wt32-sc01-plus]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
      # The cache above only holds downloads, so every run compiled the whole
      # firmware and the ESP32 core again: about 12 minutes for a one line
      # change. This one keeps the installed toolchain and the object files.
      # A new key per run saves what this run built; restore-keys picks up the
      # newest one for the same platformio.ini. SCons decides by content, so a
      # fresh checkout does not make unchanged sources look new.
      - name: Cache PlatformIO toolchain and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            .pio
          key: ${{ runner.os }}-pio-build-${{ matrix.env }}-${{ hashFiles('**/platformio.ini') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pio-build-${{ matrix.env }}-${{ hashFiles('**/platformio.ini') }}-
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          pio run -e ${{ matrix.env }} 2>&1 | tee pio-build.log
      # What the build actually did, as a notice on the run: how many files it
      # compiled, whether PlatformIO threw the build directory away, and
      # whether the ESP-IDF core was rebuilt. Tells whether the cache above
      # is doing its job without anyone having to read the whole log.
      - name: Build statistics
        if: always()
        shell: bash
        run: |
          [ -f pio-build.log ] || exit 0
          compiled=$(grep -c '^Compiling ' pio-build.log || true)
          cleaned=$(grep -ciE 'outdated|cleaning' pio-build.log || true)
          idf=$(grep -ciE 'sdkconfig|esp-idf|hybrid|reconfigur' pio-build.log || true)
          echo "::notice title=Build statistics::compiled=$compiled cleaned=$cleaned idf_lines=$idf"
          grep -iE 'outdated|cleaning|sdkconfig changed|Building in release|framework.*(compil|build)' pio-build.log | head -15 | while read -r l; do
            echo "::notice title=Build line::$l"
          done
      - name: Refuse a binary an installed device could not take
        # Every device flashed so far has a 3 MB app slot, and OTA never
        # rewrites the partition table. A larger binary would be refused by
        # esp_ota_begin() on all of them, so the build fails here first.
        run: |
          SIZE=$(stat -c %s .pio/build/${{ matrix.env }}/firmware.bin)
          echo "firmware.bin: $SIZE bytes of 3145728"
          if [ "$SIZE" -gt 3145728 ]; then
            echo "::error::firmware.bin is $SIZE bytes, more than the 3 MB app slot of installed devices"
            exit 1
          fi
      # Here rather than in the house-rules job: both tools measure icons from
      # LVGL's symbol header, and that only exists once the build has unpacked
      # the library.
      - name: French column and width budgets
        run: |
          if [ -f tools/lang_fr.py ]; then
            python3 tools/lang_fr.py check
            python3 tools/fit_check.py --gate
          fi
      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}-${{ github.sha }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          retention-days: 14
